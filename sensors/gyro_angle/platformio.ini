; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[platformio]
default_envs = nodemcu-32s, esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

[env:nodemcu-32s]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed=115200

lib_deps =
    adafruit/Adafruit MPU6050 @ ^2.2.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    madhephaestus/ESP32Servo @ ^3.0.6
    arduino-libraries/Madgwick
    tkjelectronics/Kalman Filter Library @ ^1.0.2
;     https://github.com/xioTechnologies/Fusion.git

; lib_ignore =
;     Fusion/Examples
;     Fusion/Python

; build_flags = -I.pio/libdeps/nodemcu-32s/Fusion/Fusion


; Before debugging start verilator using command "pio run -t start_
;debug_tool = verilator
debug_init_break = tbreak next